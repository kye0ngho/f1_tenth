localization_node:
  ros__parameters:
    input_odom_topic: "/ego_racecar/odom"
    output_odom_topic: "/localization/odom"
    output_pose_topic: "/localization/pose"

map_server_node:
  ros__parameters:
    map_yaml: "/sim_ws/src/localization/maps/map.yaml"
    map_topic: "/map"
    frame_id: "map"
    publish_rate: 1.0

imu_odometry_node:
  ros__parameters:
    odom_topic: "/ego_racecar/odom"
    imu_topic: "/imu/data"
    output_topic: "/localization/odom_fused"
    alpha: 0.5
    gyro_bias_samples: 100

particle_filter_node:
  ros__parameters:
    map_topic: "/map"
    scan_topic: "/scan"
    odom_topic: "/ego_racecar/odom"
    output_odom_topic: "/localization/odom"
    output_pose_topic: "/localization/pose"
    particle_cloud_topic: "/localization/particles"
    frame_id: "map"

    num_particles: 500
    downsample_beams: 20
    max_range: 10.0

    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.05
    alpha4: 0.05

    z_hit: 0.8
    z_rand: 0.2
    sigma_hit: 0.15

    initial_spread_xy: 0.5
    initial_spread_theta: 0.3

amcl_bridge_node:
  ros__parameters:
    amcl_pose_topic: "/amcl_pose"
    raw_odom_topic: "/ego_racecar/odom"
    output_odom_topic: "/localization/odom"
    output_pose_topic: "/localization/pose"
    map_frame: "map"
    base_frame: "base_link"

# 3D LiDAR → 2D LaserScan 변환 (실차 drive_mode:=real 전용)
# VLP-16 기준: min_height/max_height 로 수평 링만 추출
pointcloud_to_laserscan:
  ros__parameters:
    target_frame: base_link
    transform_tolerance: 0.01
    min_height: -0.1        # sensor 아래로 이 깊이까지 포함 (m)
    max_height: 0.1         # sensor 위로 이 높이까지 포함 (m)
    angle_min: -3.14159265
    angle_max: 3.14159265
    angle_increment: 0.00872665   # 0.5도 해상도
    scan_time: 0.1
    range_min: 0.45
    range_max: 25.0
    use_inf: true
    inf_epsilon: 1.0
    concurrency_level: 1
