lab8_mpc_node:
  ros__parameters:
    enabled: false
    solve_when_disabled: true

    # RViz visual-test mode: use simulator odom directly. AMCL's map->odom
    # estimate can drift or stay stale after /sim_reset_pose, while /odom is
    # reset to the same coordinates as the track waypoints.
    global_frame_id: "odom"
    base_frame_id: "ego_racecar/base_link"
    odom_topic: "/ego_racecar/odom"
    path_topic: "/planning/path"
    drive_topic: "/drive"
    collision_topic: "/ego_racecar/collision"
    disable_on_collision: false
    collision_disable_count: 3

    wheelbase: 0.33
    horizon_steps: 12
    dt: 0.10
    control_rate: 10.0

    # Fast visual-test profile: raise straight speed, but slow reference
    # spacing in high-curvature sections so the car does not enter tight
    # corners at the same speed as straights.
    target_speed: 4.00
    min_reference_speed: 1.15
    corner_slowdown_gain: 0.11
    max_lateral_accel: 5.30
    max_speed: 4.00
    max_acceleration: 7.00
    max_steering_angle: 0.4189
    max_steering_rate: 3.50

    # Cost weights: state [x, y, v, yaw], input [accel, steer].
    q_x: 20.0
    q_y: 20.0
    q_speed: 3.0
    q_yaw: 8.0
    qf_scale: 1.5
    r_acceleration: 0.20
    r_steering: 1.00
    rd_steering: 10.00

    max_path_distance: 1.20
    max_heading_error: 1.0472
    odom_timeout: 0.50
    path_timeout: 2.00
    search_back_points: 5
    search_forward_points: 30

    safety_enabled: true
    scan_topic: "/scan"
    safety_forward_half_angle: 0.40
    safety_bumper_distance: 0.22
    safety_max_deceleration: 4.50
    safety_scan_timeout: 0.30
    safety_tracking_error_start: 0.10
    safety_tracking_error_gain: 4.00
