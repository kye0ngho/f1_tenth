nonlinear_mpc_node:
  ros__parameters:
    enabled: false
    solve_when_disabled: true

    global_frame_id: "map"
    base_frame_id: "ego_racecar/base_link"
    odom_topic: "/ego_racecar/odom"
    path_topic: "/planning/path"
    drive_topic: "/drive"
    collision_topic: "/ego_racecar/collision"

    wheelbase: 0.33
    horizon_steps: 10
    dt: 0.10
    control_rate: 10.0

    # SLSQP is a heavier solve than the QP-based variants -- keep the
    # horizon/rate conservative until solve_time_ms is measured on target
    # hardware. Conservative first closed-loop test, matching
    # algorithms/control/config/mpc_params.yaml's starting point.
    max_steering_angle: 0.4189
    max_speed: 0.75
    min_speed: 0.28
    max_acceleration: 1.50
    target_speed: 0.55

    # Cost weights: state [x, y, theta, v], input [delta, a].
    w_cte: 2.0
    w_eth: 1.5
    w_v: 0.5
    w_delta: 0.1
    w_a: 0.05
    w_ddelta: 2.0
    w_da: 0.5

    max_path_distance: 0.80
    max_heading_error: 1.0472
    odom_timeout: 0.50
    path_timeout: 2.00
    search_back_points: 5
    search_forward_points: 30
