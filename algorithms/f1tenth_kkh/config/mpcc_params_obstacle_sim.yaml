mpcc_node:
  ros__parameters:
    enabled: false
    solve_when_disabled: true

    global_frame_id: "map"
    base_frame_id: "ego_racecar/base_link"
    odom_topic: "/car_state/odom"
    path_topic: "/planning/path"
    speed_profile_topic: "/planning/speed_profile"
    speed_profile_enabled: true
    speed_profile_timeout: 2.0
    drive_topic: "/drive"
    collision_topic: "/ego_racecar/collision"

    wheelbase: 0.33
    horizon_steps: 10
    dt: 0.10
    control_rate: 10.0

    target_speed: 1.20
    min_reference_speed: 0.45
    corner_slowdown_gain: 0.70
    max_speed: 1.50
    max_acceleration: 2.00
    max_steering_angle: 0.4189
    max_steering_rate: 99.0
    max_lateral_accel: 2.20
    v_theta_min: 0.0
    v_theta_max: 1.50

    q_contour: 35.0
    q_lag: 30.0
    q_speed: 6.0
    q_progress: 1.2
    qf_scale: 1.5
    r_acceleration: 0.25
    r_steering: 1.40
    rd_acceleration: 0.60
    rd_steering: 10.00
    rd_v_theta: 0.70

    max_path_distance: 1.20
    max_heading_error: 1.0472
    odom_timeout: 0.50
    path_timeout: 2.00
    search_back_points: 5
    search_forward_points: 30

    solver_backend: "cvxpy"
    solver_eps_abs: 0.004
    solver_eps_rel: 0.004
    solver_max_iter: 700
    solver_polish: false
    solver_verbose: false
    solver_ignore_dpp: true
    solver_warm_start: true
    publish_visualization_rate: 4.0

    obstacle_enabled: true
    scan_topic: "/scan_with_obstacle"
    laser_frame_id: "ego_racecar/laser"
    obstacle_cluster_jump_m: 0.15
    obstacle_min_points: 3
    obstacle_max_width_m: 0.60
    obstacle_max_range_m: 4.00
    obstacle_corridor_m: 0.50
    obstacle_relevance_ahead_m: 3.00
    obstacle_relevance_behind_m: 0.30
    obstacle_longitudinal_margin_m: 0.35
    obstacle_keepout_radius_m: 0.20
    obstacle_slowdown_gain: 7.00
    obstacle_stale_timeout_s: 0.50
