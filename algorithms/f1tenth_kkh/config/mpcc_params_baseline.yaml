mpcc_node:
  ros__parameters:
    enabled: false
    solve_when_disabled: true

    global_frame_id: "map"
    base_frame_id: "ego_racecar/base_link"
    odom_topic: "/car_state/odom"
    path_topic: "/planning/path"
    speed_profile_topic: "/planning/speed_profile"
    speed_profile_enabled: true
    speed_profile_timeout: 2.0
    drive_topic: "/drive"
    collision_topic: "/ego_racecar/collision"

    wheelbase: 0.33
    horizon_steps: 10
    dt: 0.10
    control_rate: 10.0

    # Conservative first closed-loop test, matching
    # algorithms/control/config/mpc_params.yaml's starting point. MPCC's
    # own progress-reward term (q_progress) is what pushes speed up, not
    # target_speed, so start q_progress low until solve_time_ms and
    # tracking error are characterized.
    target_speed: 0.55
    min_reference_speed: 0.28
    corner_slowdown_gain: 0.65
    max_speed: 0.75
    max_acceleration: 1.50
    max_steering_angle: 0.4189
    v_theta_min: 0.0
    v_theta_max: 0.75

    # Cost weights: state [x, y, v, yaw, theta], input [accel, steer, v_theta].
    q_contour: 25.0
    q_lag: 25.0
    q_speed: 3.0
    q_progress: 2.0
    qf_scale: 1.5
    r_acceleration: 0.20
    r_steering: 1.00
    rd_acceleration: 0.50
    rd_steering: 8.00
    rd_v_theta: 0.50

    max_path_distance: 0.80
    max_heading_error: 1.0472
    odom_timeout: 0.50
    path_timeout: 2.00
    search_back_points: 5
    search_forward_points: 30
