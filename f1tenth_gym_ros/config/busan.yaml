bridge:
  ros__parameters:
    # topics and namespaces
    ego_namespace: 'ego_racecar'
    ego_scan_topic: 'scan'
    ego_odom_topic: 'odom'
    ego_opp_odom_topic: 'opp_odom'
    ego_drive_topic: 'drive'
    opp_namespace: 'opp_racecar'
    opp_scan_topic: 'opp_scan'
    opp_odom_topic: 'odom'
    opp_ego_odom_topic: 'opp_odom'
    opp_drive_topic: 'opp_drive'

    # LiDAR related parameters
    lidar_enabled: True
    lidar_base_link_to_lidar_tf: [0.275, 0.0, 0.0]
    lidar_noise_std: 0.01

    # laserscan parameters
    scan_num_beams: 819
    scan_range_min: 0.05
    scan_range_max: 25.0
    scan_angle_min: -135.0
    scan_angle_max: 135.0

    # map parameters: busan track (studyingrobot/f1tenth autonomy_ws maps/busan)
    map_path: 'maps/busan'
    map_img_ext: '.pgm'

    vehicle_params: 'f1tenth'
    scale: 1.0

    num_agent: 2

    # ego starting pose, derived from busan_raceline.csv via the same
    # calmest-straight heuristic autonomy.launch.py uses for mode:=sim
    sx: 4.1166
    sy: 0.5010
    stheta: 0.2146

    # Stationary obstacle for local_obstacle_planner_node avoidance
    # testing: a low-curvature stretch of the raceline (idx 412), offset
    # 0.2m off the centerline so there is room to pass on one side. An
    # obstacle placed on the centerline itself needs more corridor width
    # than most of this track's ~0.68m wall clearance allows and triggers
    # AEB_STOP instead of a clean avoid.
    sx1: -5.6068
    sy1: -1.0493
    stheta1: 0.2434

    kb_teleop: False
    use_sim_time: False
    async_mode: True

foxglove:
  ros__parameters:
    open_foxglove: False
    target: 'browser'
